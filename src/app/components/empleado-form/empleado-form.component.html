<div class="container mt-4">
  <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">

    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">{{ esEdicion ? 'Editar Empleado' : 'Nuevo Empleado' }}</h4>
    </div>

    <div class="card-body">
      <form #empleadoForm="ngForm" (ngSubmit)="guardar()">

        <div class="mb-3">
          <label for="nombreEmpleado" class="form-label">Nombre Completo:</label>
          <input type="text" class="form-control" name="nombre" id="nombreEmpleado"
            [(ngModel)]="empleado.nombre" #nombreInput="ngModel" required
            placeholder="Nombre del empleado" />
        </div>

        <div class="mb-3">
          <label for="correoEmpleado" class="form-label">Correo Electrónico:</label>
          <input type="email" class="form-control" name="correo" id="correoEmpleado"
            [(ngModel)]="empleado.correo" #correoInput="ngModel" required email
            placeholder="ejemplo@empresa.com" />
        </div>

        <div class="mb-3">
          <label for="departamento" class="form-label">Departamento:</label>
          <select class="form-select" name="departamento" id="departamento"
            [(ngModel)]="empleado.departamento_id" required>
            <option [value]="0" disabled>Selecciona un departamento...</option>

            @for (depto of departamentos(); track depto.id) {
              <option [value]="depto.id">{{ depto.nombre }}</option>
            }
          </select>
        </div>

        <div class="mb-4">
          <label for="puesto" class="form-label">Puesto:</label>
          <select class="form-select" name="puesto" id="puesto"
            [(ngModel)]="empleado.puesto_id" required>
            <option [value]="0" disabled>Selecciona un puesto...</option>

            @for (puesto of puestos(); track puesto.id) {
              <option [value]="puesto.id">{{ puesto.nombre }}</option>
            }
          </select>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary" (click)="cancelar()">
            Cancelar
          </button>

          <button type="submit" class="btn btn-success"
            [disabled]="empleadoForm.invalid || empleado.departamento_id === 0 || empleado.puesto_id === 0">
            {{ esEdicion ? 'Actualizar Datos' : 'Guardar Empleado' }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
