<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Lista de Empleados</h2>

    <div>
      <button class="btn btn-outline-success me-2" (click)="exportarExcel()">
          <i class="bi bi-file-earmark-spreadsheet-fill me-2"></i>
          Exportar a Excel
      </button>
      <button class="btn btn-outline-danger me-2" (click)="exportarPDF()">
          <i class="bi bi-file-earmark-pdf-fill me-2"></i>
          Exportar a PDF
      </button>
    </div>
  </div>

  <table class="table table-striped mt-3 shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Departamento</th>
        <th>Puesto</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (empleado of empleados(); track empleado.id) {
        <tr>
          <td>{{ empleado.id }}</td>
          <td>{{ empleado.nombre }}</td>
          <td>{{ empleado.correo }}</td>
          <td>{{ empleado.departamento }}</td>
          <td>{{ empleado.puesto }}</td>
          <td>
            <button class="btn btn-warning btn-sm me-2" (click)="confirmarEditar(empleado)">
              Editar
            </button>

            <button class="btn btn-danger btn-sm" (click)="confirmarEliminar(empleado)">
              Eliminar
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="text-center">No hay empleados registrados.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
